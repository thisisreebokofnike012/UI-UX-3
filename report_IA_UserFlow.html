# Практическая работа №3
## Тема: Информационная архитектура и моделирование пользовательских потоков (IA · Card Sorting · User Flow · Task Flow)

---

### Выходные метаданные проекта
- **Дисциплина:** UX / UI Design & Product Architecture
- **Тип документа:** Академический аналитический отчёт по проектированию информационной архитектуры
- **Объект проектирования:** Мобильное финансовое приложение необанка **«PocketBank»**
- **Платформа:** iOS / Android (Mobile First)
- **Целевая среда:** Финансовые технологии (FinTech), персональный банкинг, управление активами

---

## 1. Титульная часть и цели работы

### 1.1. Введение и актуальность
В современных цифровых продуктах с высокой плотностью функционала ключевым фактором удержания пользователей (Retention Rate) и снижения оттока (Churn Rate) выступает качество **информационной архитектуры (Information Architecture, IA)**. В финтех-продуктах пользователь сталкивается с высоким уровнем когнитивной нагрузки и стресса: ошибки при переводе средств, непрозрачность баланса или скрытые комиссии напрямую подрывают доверие к сервису.

Цель настоящей работы — спроектировать интуитивно понятную, масштабируемую и когнитивно разгруженную информационную архитектуру мобильного банка «PocketBank», провести эмпирическое исследование ментальных моделей пользователей методом карточной сортировки (Card Sorting), а также формализовать высокоуровневые и микросценарные пользовательские пути (User Flow и Task Flow).

### 1.2. Объект проектирования: Необанк «PocketBank»
**PocketBank** — кроссплатформенное мобильное приложение смарт-банкинга нового поколения. Продукт объединяет классические расчетно-кассовые операции, экосистему быстрых платежей (СБП, QR, платежи по расписанию), автоматизированный учет личных финансов (PFM — Personal Finance Management), инвестиционные микросервисы и круглосуточную омниканальную поддержку.

### 1.3. Целевая аудитория: Портреты 3 ключевых пользовательских сегментов

| Параметр | Сегмент 1: «Рациональный организатор» | Сегмент 2: «Фрилансер-номад» | Сегмент 3: «Digital Native / Начинающий инвестор» |
| :--- | :--- | :--- | :--- |

| **Род занятий** | Финансовый менеджер в ритейле, мать двоих детей | UI/UX-дизайнер на фрилансе, самозанятый | Студент магистратуры IT, стажер-разработчик |
| **Психографика** | Педантична, ценит безопасность, планирует расходы наперед, избегает спонтанных покупок. | Мобилен, доходы нерегулярны, ценит скорость и простоту трансграничных переводов и СБП. | Технологичен, ориентирован на геймификацию, ищет пассивный доход, активно пользуется кешбэком. |

### 1.4. Обоснование выбора продукта для многоуровневой архитектуры
Банковское приложение представляет собой идеальный полигон для архитектурного проектирования по следующим причинам:
1. **Экстремальная плотность разнородного контента:** сервис включает как регулярные линейные утилитарные задачи (P2P-переводы, сканирование QR), так и комплексные аналитические экраны (диаграммы расходов, детализация портфелей, настройки безопасности).
2. **Критичность цены ошибки:** интерфейс обязан предотвращать миссклики (Slip & Mistake Prevention по Норману), предоставлять механизмы подтверждения (Confirmation Dialogues) и прозрачной обратной связи (System Status Visibility по Нильсену).
3. **Многоуровневость иерархии:** чтобы сохранить глубину кликов не более 3–4 уровней при наличии более 50 прикладных функций, требуется строгая кластеризация данных на основе ментальных моделей пользователей.

## 3. Исследование методом Card Sorting

### 3.1. Параметры исследования
Для исключения субъективного взгляда проектировщика и выявления реальных ментальных моделей целевой аудитории было проведено эмпирическое юзабилити-исследование.

- **Метод исследования:** **Открытая карточная сортировка (Open Card Sorting)**. Участникам предоставлялся набор неклассифицированных карточек с функциональными элементами и предлагалось самостоятельно сгруппировать их по смыслу, а затем дать каждой сформированной группе понятное название.
- **Инструментарий:** Цифровая доска **FigJam** с интерактивными стикерами и дублирующий замер в **Optimal Workshop** для построения матриц схожести (Similarity Matrix) и дендрограмм кластеризации.
- **Выборка респондентов:** 15 участников (возраст 19–48 лет), сбалансированных по ключевым сегментам:
  - 5 человек — базовые пользователи с низкой технической грамотностью;
  - 5 человек — активные пользователи цифровых сервисов (фрилансеры, менеджеры);
  - 5 человек — продвинутые пользователи финтеха (используют инвестиции, брокерские счета, кешбэк-стратегии).

### 3.2. Анализ качественных наблюдений и ментальных моделей участников

1. **Коллизия «Кешбэк и бонусы» (Карточка C11):**
   - 40% участников определили кешбэк в раздел «Аналитика и расходы», воспринимая его как результат анализа трат («я потратил — банк вернул»).
   - 35% респондентов поместили его в раздел «Главная / Профиль», ассоциируя кешбэк с персональной выгодой и статусом клиента.
   - 25% соотнесли его с «Накоплениями», посчитав кешбэк источником пополнения копилки.
   - *Проектное решение:* На базовом уровне навигации закрепить выжимку кешбэка на Главном дашборде (виджет быстрого доступа), а детальное управление категориями и партнерскими спецпредложениями поместить в контекст аналитики трат («Аналитика и Выгода»).

2. **Коллизия «Заказ официальных справок» (Карточка C15):**
   - Участники младшей группы (19–25 лет) искали справки в «Чате с поддержкой» («я напишу боту, он пришлет мне файл»).
   - Участники старшей группы ожидали увидеть данный пункт строго в «Профиле / Документах».
   - *Проектное решение:* Основную точку входа разместить в разделе «Профиль → Документы и справки», дополнительно реализовав контекстную команду в чат-боте («Справка для визы») с глубоким диплинком на генератор выписок.

3. **Коллизия «QR-оплата и сканер счетов» (Карточки C04 и C18):**
   - Респонденты единогласно связали сканирование QR с действием перевода и платежа, однако 80% отметили, что физически на кассе им требуется доступ к сканеру «в один тап прямо с экрана разблокировки или главного экрана».
   - *Проектное решение:* В информационной архитектуре элемент C04 относится к разделу «Платежи», но на уровне UI выносится в Quick Action на верхний AppBar Главного экрана и в шорткаты мобильной ОС.

Во время открытой сортировки пользователи присваивали группам бытовые и ситуативные наименования. Для формирования профессионального информационного каркаса была проведена стандартизация терминологии:

| Неформальное название пользователя | Ментальная установка | Стандартизированный термин IA |
| :--- | :--- | :--- |
| *«Мои деньги и карточки»* | Стремление сразу увидеть баланс и статус счетов | **Главная (Обзор счетов)** |
| *«Переводы, оплата ЖКХ и налоги»* | Ассоциация с транзакционным утилитарным действием | **Платежи и переводы** |
| *«Копилки, акции и цели на будущее»* | Ориентация на отложенное потребление и сбережения | **Накопления и активы** |
| *«Куда ушли деньги и мои бонусы»* | Потребность в контроле бюджета и оптимизации затрат | **Аналитика и бюджет** |
| *«Шестеренки, безопасность и связь с банком»* | Ассоциация с технической поддержкой и настройками | **Профиль и безопасность** |

| **4. Аналитика** | **C09** (Диаграмма категорий), **C10** (Лимиты бюджетов), **C11** (Кешбэк и привилегии) | Осознанное управление личными финансами, оптимизация трат, получение бонусов. |
| **5. Профиль** | **C12** (Управление картами), **C13** (Безопасность/2FA), **C14** (Лимиты карт), **C15** (Заказ справок), **C16** (Чат поддержки) | Идентификация, защита персональных данных, сервисные запросы и поддержка клиентов. |

## 4. Информационная архитектура (Information Architecture)

### 4.1. Архитектурная модель и навигационные паттерны
Для приложения PocketBank спроектирована **гибридная трёхуровневая иерархическая структура** с акцентом на плоскостность (Flat Hierarchy): глубина навигации ни в одной ветке не превышает 3 уровней (`Уровень 0 → Уровень 1 → Уровень 2`), что снижает когнитивную нагрузку и время поиска информации.

#### Навигационные паттерны:
1. **Нижняя навигационная панель (Bottom Tab Bar):**
   - Служит глобальным каркасом приложения (Global Hub).
   - Содержит ровно 5 вкладок первого уровня, доступных из любой части приложения в один тап.
   - Фиксирует ментальный якорь пользователя в соответствии с принципами эргономики мобильных интерфейсов.
2. **Точки быстрого доступа (Quick Action Points / Floating Bar):**
   - Плавающий виджет «Быстрый перевод / QR» на Главном экране для ускорения доступа к критическим действиям в обход глубоких разделов меню.
   - Горизонтальный скролл частых контактов (Favorites) на экране платежей.
3. **Хлебные крошки и контекстная навигация (Modal Navigation & Back Navigation):**
   - На экранах 2-го и 3-го уровней используется системный Top Navigation Bar с явным заголовком текущего шага и кнопкой возврата назад (`Back / Dismiss`).
   - Для многошаговых сценариев (например, оплата или выпуск карты) применяется линейный степпер (Progress Stepper), информирующий о текущем шаге воронки.

## 5. User Flow (Пользовательский сценарий верхнего уровня)

### 5.1. Постановка сквозного сценария
- **Сценарий:** Сквозной перевод денежных средств физическому лицу по номеру телефона через Систему быстрых платежей (СБП).
- **Контекст:** Пользователь хочет отправить 3 500 рублей коллеге в счет оплаты совместного обеда.
- **Критичность сценария:** Сценарий содержит финансовые риски, требует строгой валидации доступного остатка на счете списания, динамической проверки корректности номера получателя, подтверждения операции биометрией и циклической обработки ошибок ввода данных.

### 5.2. Пошаговое текстовое описание логики User Flow

1. **Точка входа:**
   - Пользователь запускает приложение PocketBank.
   - Прохождение быстрой авторизации по Face ID / Touch ID.
   - Попадание на Главный экран (Dashboard).
2. **Инициация действия:**
   - Пользователь нажимает кнопку быстрого действия «Перевести» на Главном экране (либо переходит во вкладку «Платежи» → «По номеру телефона через СБП»).
3. **Выбор адресата:**
   - Открывается форма перевода. Пользователь вводит 10 цифр номера телефона вручную либо выбирает контакт из адресной книги устройства.
4. **Валидация адресата:**
   - Система опрашивает справочник СБП: найден ли привязанный банк у получателя?
   - *Ветвление 1:* Если номер некорректен или не подключен к СБП, система выдает ошибку в форме инлайн-подсказки и возвращает пользователя к выбору контакта.
5. **Ввод суммы и выбор счета:**
   - Пользователь выбирает счет списания (дебетовая карта, текущий счет) и указывает сумму перевода.
6. **Валидация баланса (Критическая точка принятия решения):**
   - Система сопоставляет введенную сумму с доступным остатком на счете списания (с учетом возможных комиссий).
   - *Ветвление 2 (Условие):*
     - **Случай А (Недостаточно средств):** Отображается модальное окно с сообщением «Недостаточно средств на счете». Система предлагает два варианта: изменить сумму перевода либо выбрать другой счет списания. Пользователь возвращается на шаг назад в цикл исправления.
     - **Случай Б (Средств достаточно):** Активируется кнопка «Продолжить».
7. **Экран подтверждения (Review & Pre-Confirmation):**
   - Пользователю выводятся сводные данные: ФИО получателя (маскированное, например: *Иван Иванович И.*), банк получателя, сумма списания, комиссия (0 ₽).
8. **Авторизация транзакции (Security Gate):**
   - Пользователь нажимает «Перевести [Сумма]».
   - Запрос подтверждения биометрией (Face ID / Touch ID) или вводом проверочного 4-значного PIN-кода.
9. **Обработка процессингом СБП:**
   - Если процессинг одобрил операцию, формируется транзакция.
10. **Финальное состояние (Success State):**
    - Экран успеха с зеленой динамической анимацией: «Перевод отправлен».
    - Кнопки действий: «Сохранить чек в PDF», «Создать регулярный автоплатеж», «Вернуться на Главную».

## 6. Task Flow (Линейная задача)

### 6.1. Описание изолированной микрозадачи
- **Микрозадача:** **«Оплата покупки по динамическому QR-коду на кассе магазина через СБП»**.
- **Ключевой фокус:** Максимальная скорость выполнения (Time-to-Task < 5 секунд), минимизация когнитивного трения на кассе, строгая линейность сценария (Zero-Friction Happy Path).
- **Характеристика:** В отличие от общего User Flow, в Task Flow отсутствуют альтернативные пользовательские развилки и логические разветвления — процесс строго последователен и оптимизирован под кассовую зону самообслуживания.

### 6.2. Пошаговая детализация (6 строго линейных шагов)

| Шаг | Название шага | Действие пользователя и системный отклик |
| :---: | :--- | :--- |
| **Шаг 1** | **Активация сканера** | Пользователь нажимает физическую иконку сканера QR на главном экране приложения (или долгое удержание иконки приложения Quick Actions). |
| **Шаг 2** | **Наведение видоискателя** | Запуск системного модуля камеры; пользователь совмещает рамку видоискателя со статическим/динамическим QR-кодом на терминале кассы. |
| **Шаг 3** | **Парсинг и декодирование** | Автоматическое мгновенное распознавание платежного шлюза СБП без дополнительных кликов со стороны пользователя. |
| **Шаг 4** | **Отображение счета кассы** | Экран автоматически заполняется предзаполненными параметрами: Торговая точка («Супермаркет ВкусВилл»), точная сумма к оплате («842,50 ₽»), предвыбранная активная дебетовая карта. |
| **Шаг 5** | **Одноточечное подтверждение** | Пользователь нажимает главную целевую кнопку «Оплатить 842,50 ₽» и подтверждает операцию касанием Face ID. |
| **Шаг 6** | **Кассовый отклик (Success)** | Мгновенный вывод тактильного виброотклика (Haptic Feedback), зеленая галочка успешной оплаты и автоматический переход на главный экран через 3 секунды. |

## 7. Аналитическое обоснование проектных решений

### 7.1. Обоснование выбора открытой карточной сортировки (Open Card Sorting)
В исследовании была сознательно выбрана **открытая**, а не закрытая сортировка карточек по следующим фундаментальным причинам:
1. **Предотвращение профессиональной деформации (Designer Bias):** При закрытой сортировке названия категорий навязываются исследователем. Пользователь вынужден «подгонять» карточки под чужие ментальные конструкции. Открытый метод позволил выявить органический язык целевой аудитории (пользовательский лексикон).
2. **Дискавери-потенциал на этапе проектирования с нуля:** Открытая сортировка помогла обнаружить неочевидные когнитивные связи: например, тот факт, что кешбэк воспринимается респондентами не как банковская услуга, а как компонент аналитики и оптимизации расходов («Сколько я сэкономил»).
3. **Формирование таксономии и словаря интерфейса:** Анализ свободных пользовательских ярлыков позволил заменить перегруженную банковскую терминологию (например, «Депозитные расчетные инструменты физических лиц») на дружелюбный и функциональный термин («Накопления и копилки»).

### 7.2. Обоснование структуры нижнего меню из 5 разделов (Эргономика и когнитивные законы)
Фиксация верхнеуровневой навигации строго на **5 разделах** базируется на сочетании физиологических и психофизиологических законов взаимодействия с портативными сенсорными экранами:

1. **Когнитивное правило Миллера и закон Хика:**
   - Закон Миллера гласит, что объем кратковременной памяти ограничен диапазоном 7 ± 2 элементов. Современные исследования в области мобильного когнитивного UX (исследования Nielsen Norman Group) сужают этот диапазон для мобильных навигационных систем до 4 ± 1 элементов в поле зрения.
   - Согласно закону Хика, время принятия решения логарифмически возрастает с увеличением числа альтернатив. Выбор из 5 опций обеспечивает минимальное время ориентирования без перегрузки внимания.
2. **Анатомическая зона досягаемости (Thumb Zone по Стивену Хуберу):**
   - 75% пользователей управляют смартфоном одной рукой, удерживая его снизу. Нижняя область экрана является зоной максимального комфорта («Natural Thumb Zone»). Размещение 5 вкладок равномерно заполняет ширину экрана, гарантируя достаточную площадь сенсорной мишени (Touch Target Size не менее 48 x 48 pt по гайдлайнам Apple HIG и Google Material 3) и исключая ложные нажатия.
3. **Ортогональность разделов:**
   - 5 выбранных разделов являются взаимоисключающими и совместно исчерпывающими (принцип MECE — Mutually Exclusive, Collectively Exhaustive). Главная дает моментальный статус, Платежи отвечают за исходящий поток, Накопления — за сбережение, Аналитика — за рефлексию и контроль, Профиль — за сервисное администрирование.

### 7.3. Принципиальное архитектурное различие между User Flow и Task Flow
В проектной практике UX-архитектуры критически важно разделять эти две методологии моделирования поведения:

| Критерий сравнения | User Flow (Пользовательский поток) | Task Flow (Поток выполнения задачи) |
| :--- | :--- | :--- |
| **Масштаб и охват** | **Макроуровень:** Сквозной системный маршрут пользователя через экраны, модальные окна, промежуточные сервисы и системные прерывания. | **Микроуровень:** Изолированная атомарная задача в рамках одной конкретной функции сервиса. |
| **Характер траектории** | **Нелинейный:** Обязательно включает развилки условий (Decision Diamonds), циклы обработки ошибок, валидацию и откаты на шаг назад. | **Строго линейный:** Единственный кратчайший путь («Happy Path») от старта до завершения без альтернативных ответвлений. |
| **Учет ошибок и состояний** | Проектирует поведение системы в кризисных точках: «Неверный ввод», «Отказ в авторизации», «Превышен лимит», «Сетевой сбой». | Предполагает идеальное выполнение (Default Success), оптимизируя скорость и исключая трение. |
| **Цель артефакта** | Выявить «слепые зоны» логики, предусмотреть безопасные сценарии восстановления (Recovery Paths) и подтверждения действий. | Минимизировать показатель **Time-to-Task** и число необходимых физических тапов на экране. |
| **Пример в PocketBank** | Полноценный перевод по СБП с проверкой баланса, вводом суммы, подтверждением через Face ID и обработкой отказа шлюза. | Быстрое сканирование кассового QR-кода и мгновенная оплата в один жест на кассе. |

## 8. Заключение

В ходе выполнения практической работы №3 была реализована полная цепочка проектирования информационной архитектуры и пользовательских сценариев мобильного необанка **«PocketBank»**:

1. **От инвентаря к ментальной модели:** Формирование структурированного списка контента из 18 функциональных единиц и проведение открытой карточной сортировки (Open Card Sorting) позволило устранить разрыв между профессиональным языком финансистов и ментальными ожиданиями реальных пользователей. Были выявлены и успешно разрешены когнитивные коллизии вокруг кешбэка, справок и QR-платежей.
2. **Иерархическая устойчивость:** Спроектированная трёхуровневая информационная архитектура (IA) на базе эргономичного 5-вкладочного Tab Bar обеспечивает предельную глубину навигации не более 3 кликов. Использование навигационных паттернов Quick Actions и контекстных диплинков позволяет пользователю мгновенно достигать целевых экранов в условиях дефицита времени.
3. **Моделирование сценариев разного масштаба:** 
   - Построенный **User Flow** перевода средств через СБП детально описывает стрессоустойчивую архитектуру: валидация адресата, цикл исправления ошибки баланса и биометрическая верификация гарантируют безопасность финансовых транзакций.
   - Разработанный **Task Flow** кассовой QR-оплаты демонстрирует образец линейной микрооптимизации, доводящей выполнение сценария до минимальных 6 шагов без когнитивного шума.

  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    const rawMarkdown = document.getElementById('markdown-source').textContent;
    
    // Настройка кастомного рендерера marked для mermaid
    const renderer = new marked.Renderer();
    const originalCodeRenderer = renderer.code.bind(renderer);
    
    renderer.code = function(code, language) {
      if (language === 'mermaid') {
        return `<div class="mermaid">${code}</div>`;
      }
      return originalCodeRenderer(code, language);
    };

    marked.setOptions({ renderer: renderer });
    document.getElementById('content').innerHTML = marked.parse(rawMarkdown);

    // Рендер Mermaid диаграмм
    mermaid.run();
  </script>
